<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Anchor · the big picture</title>
<desc>The Anchor extension runs inside your browser and watches the page you are using; the only thing online is the cloud LLM API (Groq · gpt-oss).</desc>
<style>
text{font-family:-apple-system,system-ui,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}.lbl{fill:#3d3d3a}
.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.tx-gray{fill:#444441}
.b-teal{fill:#E1F5EE;stroke:#0F6E56}.tx-teal{fill:#085041}
.b-blue{fill:#E6F1FB;stroke:#185FA5}.tx-blue{fill:#0C447C}
.b-purple{fill:#EEEDFE;stroke:#534AB7}.tx-purple{fill:#3C3489}
@media (prefers-color-scheme:dark){
.lbl{fill:#c2c0b6}
.b-gray{fill:#444441;stroke:#B4B2A9}.tx-gray{fill:#F1EFE8}
.b-teal{fill:#085041;stroke:#5DCAA5}.tx-teal{fill:#E1F5EE}
.b-blue{fill:#0C447C;stroke:#85B7EB}.tx-blue{fill:#E6F1FB}
.b-purple{fill:#3C3489;stroke:#AFA9EC}.tx-purple{fill:#EEEDFE}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="64" width="430" height="252" rx="20" class="b-gray" stroke-width="0.5"/>
<text class="th tx-gray" x="255" y="90" text-anchor="middle">Your computer (browser)</text>
<text class="ts tx-gray" x="255" y="108" text-anchor="middle">runs entirely on your machine — no server</text>
<rect x="72" y="140" width="160" height="140" rx="12" class="b-blue" stroke-width="0.5"/>
<text class="th tx-blue" x="152" y="200" text-anchor="middle">Web page you are on</text>
<text class="ts tx-blue" x="152" y="220" text-anchor="middle">active tab</text>
<rect x="278" y="140" width="170" height="140" rx="12" class="b-teal" stroke-width="0.5"/>
<text class="th tx-teal" x="363" y="200" text-anchor="middle">Anchor extension</text>
<text class="ts tx-teal" x="363" y="220" text-anchor="middle">watch · judge · accompany</text>
<line x1="232" y1="210" x2="276" y2="210" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts lbl" x="254" y="200" text-anchor="middle">watches</text>
<rect x="520" y="150" width="120" height="94" rx="12" class="b-purple" stroke-width="0.5"/>
<text class="th tx-purple" x="580" y="190" text-anchor="middle">Groq · gpt-oss</text>
<text class="th tx-purple" x="580" y="208" text-anchor="middle">API</text>
<text class="ts tx-purple" x="580" y="228" text-anchor="middle">Cloud LLM</text>
<line x1="448" y1="197" x2="518" y2="197" stroke="#8a8880" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts lbl" x="483" y="187" text-anchor="middle">Q &amp; A</text>
</svg>
